<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lando Norris — Socials Oval Gallery</title>
    
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <section data-designmode-white="" data-nav-theme-target="dark" class="s is-callout-socials">
        <div class="c is-callout-socials">
            <div class="callout-socials-inner">
                <div class="callout-socials-layout">
                    
                    <!-- Decorative Icon -->
                    <div class="callout-socials-rive-w">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="m4.93 4.93 4.24 4.24"></path>
                            <path d="m14.83 9.17 4.24-4.24"></path>
                            <path d="m14.83 14.83 4.24 4.24"></path>
                            <path d="m9.17 14.83-4.24 4.24"></path>
                        </svg>
                    </div>

                    <!-- Header Title -->
                    <h2 class="text-title-lg-mona" data-oval-scroll="">
                        <span>what’s up</span>
                        <span class="span-font-brier">On Socials</span>
                    </h2>

                    <!-- 3D Oval Gallery / Carousel Container -->
                    <div class="carousel-viewport" id="carouselViewport">
                        <div data-social-callout="wrap" class="callout-socials-card-layout" id="cardLayout">
                            
                            <!-- Card 1 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/68d3ba846e593e52541fb7a8_Lando-6-on-track.webp" 
                                         alt="Lando on track" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 2 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/6830302d42237886d0c4b24c_ln-social-img-2.webp" 
                                         alt="Lando Norris Social" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 3 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/68d3ba8463e72a95c2d8a0ba_Lando-4-off-track.webp" 
                                         alt="Lando off track" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 4 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/68d3ba848fb98d1ca68eb6c8_Lando-5-off-track.webp" 
                                         alt="Lando off track 2" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 5 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/68d3ba8449f0506fbaad037b_Lano-5-on-track.webp" 
                                         alt="Lando on track 2" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 6 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/6830302dadd0727e6ac034dd_ln-social-img-6.webp" 
                                         alt="Lando Norris Social 6" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                            <!-- Card 7 -->
                            <div data-video-stream-wrap="" class="callout-socials-card-w">
                                <div class="video-stream">
                                    <img src="https://cdn.prod.website-files.com/67b5a02dc5d338960b17a7e9/68d3ba83f162f4d2f4e78442_Lando-6-off-track.webp" 
                                         alt="Lando off track 6" 
                                         class="image is-social-card"/>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Callout Links -->
                    <div class="callout-socials-intro-w">
                        <div class="text-cta-short-intro">Follow Lando on social media</div>
                    </div>
                    
                    <div class="callout-socials-links-layout">
                        <a href="https://www.tiktok.com/@landonorris" target="_blank" class="text-link-w">
                            <div class="btn-text">TikTok</div>
                        </a>
                        <a href="https://www.instagram.com/lando" target="_blank" class="text-link-w">
                            <div class="btn-text">Instagram</div>
                        </a>
                        <a href="https://www.youtube.com/@LandoNorris" target="_blank" class="text-link-w">
                            <div class="btn-text">YouTube</div>
                        </a>
                        <a href="https://www.twitch.tv/landonorris" target="_blank" class="text-link-w">
                            <div class="btn-text">Twitch</div>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- =========================================
         OVAL CURVE 3D CONVEYOR & TILT JAVASCRIPT
         ========================================= -->
    
    <script src="./script.js"></script>
</body>
</html>
