<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Char Text Hover Button</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

  <a href="#" class="btn-w" data-anim="text-hover">
    <span class="btn-inner">
      <span class="btn-inner-text-w">
        <span class="btn-text" split-text="chars"></span>
      </span>
      <span class="btn-icon-w">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </span>
    </span>
  </a>


    <script src="./script.js"></script>
</body>
</html>
