<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Stickorator</title>

    <!-- ============ INSTANT REDIRECT ============ -->
    <meta http-equiv="refresh" content="0; url=https://stickorator.ai.studio">
    <link rel="canonical" href="https://stickorator.ai.studio">

    <!-- ============ OPEN GRAPH (for shares) ============ -->
    <meta property="og:title" content="Stickorator — AI Creative Studio">
    <meta property="og:description" content="Turn your ideas into custom stickers and character art with AI.">
    <meta property="og:image" content="../../assets/images/thumbnails/stickorator.webp">
    <meta property="og:url" content="https://stickorator.ai.studio">
    <meta property="og:type" content="website">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Stickorator — AI Creative Studio">
    <meta name="twitter:description" content="Turn your ideas into custom stickers and character art with AI.">
    <meta name="twitter:image" content="../../assets/images/thumbnails/stickorator.webp">

    <!-- ============ JS REDIRECT (faster than meta refresh) ============ -->
    <script>
        window.location.replace("https://stickorator.ai.studio");
    </script>

    <!-- ============ FALLBACK UI (only shows if redirect fails) ============ -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 40%, #1a1a1a 0%, #050505 65%);
            color: #e4e4e7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 420px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(249, 115, 22, 0.15);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #a1a1aa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.25);
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(249, 115, 22, 0.35);
        }

        .url {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 1rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Redirecting to Stickorator…</h1>
        <p>Taking you to the live app.</p>
        <a href="https://stickorator.ai.studio">Open manually →</a>
        <p class="url">https://stickorator.ai.studio</p>
    </div>

    <!-- Backup: if JS is disabled, this still works -->
    <noscript>
        <meta http-equiv="refresh" content="1; url=https://stickorator.ai.studio">
    </noscript>
</body>
</html>
