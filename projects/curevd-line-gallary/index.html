<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curved Card Fan</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="arc">
    <div class="slot"><div class="card" style="--hue:190"><span class="num">01</span><span class="glyph"></span><span class="label">Nova</span></div></div>
    <div class="slot"><div class="card" style="--hue:212"><span class="num">02</span><span class="glyph"></span><span class="label">Orbit</span></div></div>
    <div class="slot"><div class="card" style="--hue:236"><span class="num">03</span><span class="glyph"></span><span class="label">Prism</span></div></div>
    <div class="slot"><div class="card" style="--hue:262"><span class="num">04</span><span class="glyph"></span><span class="label">Pulse</span></div></div>
    <div class="slot"><div class="card" style="--hue:290"><span class="num">05</span><span class="glyph"></span><span class="label">Ember</span></div></div>
    <div class="slot"><div class="card" style="--hue:318"><span class="num">06</span><span class="glyph"></span><span class="label">Halo</span></div></div>
    <div class="slot"><div class="card" style="--hue:345"><span class="num">07</span><span class="glyph"></span><span class="label">Lyra</span></div></div>
  </div>


    <script src="./script.js"></script>
</body>
</html>
